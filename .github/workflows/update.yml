name: 定时更新

on:
  # 每天北京时间 6:00 和 18:00 自动执行（UTC 22:00 和 10:00）
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行合并脚本
        run: python merge.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            git push
          fi
